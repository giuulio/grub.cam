<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1c21" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const theme = localStorage.getItem('grub-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
            meta.content = theme === 'dark' ? '#0d1c21' : '#ffffff';
          });
        }
      } catch {}
    </script>
    <title>grub.cam</title>
    <meta name="description" content="Opening hours and today's menus for every Cambridge college dining hall, café and bar, and the University's own cafés and canteens." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:site_name" content="grub.cam" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
