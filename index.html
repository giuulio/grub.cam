<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1c21" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const theme = localStorage.getItem('grub-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
            meta.content = theme === 'dark' ? '#0d1c21' : '#ffffff';
          });
        }
      } catch {}
    </script>
    <title>grub.cam</title>
    <meta name="description" content="Explore Cambridge's college and University food map: dining hall menus, cafés, bars and formal halls, with published opening hours and prices." />
    <link rel="icon" href="/favicon.ico?v=fork" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon.png?v=fork" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=fork" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=fork" sizes="180x180" />
    <meta property="og:site_name" content="grub.cam" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
