name: Weekly menu dataset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/menu-data.yml'
      - 'scripts/export-menus.ts'
      - 'scripts/lib/menu-export.ts'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: menu-data
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run export:menus -- --out "$RUNNER_TEMP/menu-data"
      - name: Publish dated snapshot
        run: |
          tag="menu-data-$(date -u +%Y-%m-%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A snapshot already exists for today; keeping it unchanged."
          else
            gh release create "$tag" "$RUNNER_TEMP"/menu-data/*.zip --title "Menu data $(date -u +%Y-%m-%d)" --notes 'Dated public menu dataset. Read README.md for coverage, label definitions and limitations.' --latest=false
          fi
