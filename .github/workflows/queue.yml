name: Review queue

# Keeps one issue, "Review queue", saying what members sent in that waits for a person (prices, hours, notes, anything
# a model held back), so GitHub tells you when there's something to look at. No personal data goes in it (the repo is
# public): `submissions -- digest` gives only what, where, how long and why, and the commands to act on each. Runs
# on every new submission, with retries every ten minutes and a digest at 07:00 and 18:00 UTC (migration 0033).
# A submission gets a comment only once it waits for a person (what goes up or is turned back on its own gets none),
# and a held-back review a line; needs repository secrets VITE_SUPABASE_URL and SUPABASE_SECRET_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialise delivery and acknowledgement so concurrent submissions cannot produce duplicate comments.
concurrency:
  group: review-queue
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run --silent submissions -- digest > digest.md
      # One open issue, its body the queue, made the first time. An edited body notifies no one, so when what's waiting
      # has changed (the spend line aside) and isn't nothing, a one-line comment says so, which emails you
      - run: |
          number=$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title == "Review queue")] | min_by(.number) | .number // empty')
          if [ -z "$number" ]; then
            url=$(gh issue create --title 'Review queue' --body-file digest.md)
            number=${url##*/}
          fi
          before=$(gh issue view "$number" --json body --jq .body | grep -oE '^\| `[0-9a-f]{8}` \| [^|]* \| [1-5] \|' || true)
          gh issue edit "$number" --body-file digest.md
          # A submission gets its own comment from notify; a review held back has none, so a new one gets a line here
          after=$(grep -oE '^\| `[0-9a-f]{8}` \| [^|]* \| [1-5] \|' digest.md || true)
          new=$(comm -13 <(echo "$before" | sort) <(echo "$after" | sort) | grep -c . || true)
          if [ "$new" -gt 0 ]; then gh issue comment "$number" --body "$new new $([ "$new" = 1 ] && echo review || echo reviews) held back. The list is in the issue."; fi
          npm run submissions -- notify "$number"
