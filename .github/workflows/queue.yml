name: Review queue

# Keeps one issue, "Review queue", saying what members sent in that waits for a person (prices, hours, notes, anything
# a model held back), so GitHub tells you when there's something to look at. No personal data goes in it (the repo is
# public): `submissions -- digest` gives only what, where, how long and why, and the commands to act on each. Runs
# each morning and after the ingest's evening run; needs repository secrets VITE_SUPABASE_URL and SUPABASE_SECRET_KEY.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run --silent submissions -- digest > digest.md
      # One open issue, its body the queue, made the first time. An edited body notifies no one, so when what's waiting
      # has changed (the spend line aside) and isn't nothing, a one-line comment says so, which emails you
      - run: |
          number=$(gh issue list --state open --search 'in:title "Review queue"' --json number --jq '.[0].number')
          if [ -z "$number" ]; then gh issue create --title 'Review queue' --body-file digest.md; exit 0; fi
          before=$(gh issue view "$number" --json body --jq .body | grep -v '^Model ')
          after=$(grep -v '^Model ' digest.md)
          gh issue edit "$number" --body-file digest.md
          waiting=$(grep -oE '^\*\*[0-9]+ (waiting|reviews? held back)[^*]*\*\*' digest.md | sed -E 's/\*\*//g; s/[.:]$//' | paste -sd ',' - | sed 's/,/, /g' || true)
          if [ "$before" != "$after" ] && [ -n "$waiting" ]; then gh issue comment "$number" --body "$waiting. The list is in the issue."; fi
