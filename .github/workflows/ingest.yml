name: Ingest menus

# Checks the scripted sources and saves what changed to Supabase: each source's first run of the day fetches every
# published week, one every four hours the next two weeks, the rest today and tomorrow (scripts/ingest/index.ts).
# Needs repository secrets VITE_SUPABASE_URL and SUPABASE_SECRET_KEY, and OPENAI_API_KEY for menus published as
# documents (the runner's google-chrome draws Sway and Canva); with CF_DEPLOY_HOOK (a Workers Builds deploy hook) set it
# rebuilds the site when a menu changed, so the prerendered pages, sitemap and llms.txt carry the new menus.
# Keeps one issue, "Source health", listing sources that have failed twice in a row, and comments there when one
# starts failing or recovers (which emails you). Started every half hour from 06:07 to 19:37 UTC by Supabase's pg_cron
# (migration 0042), not GitHub's cron, which on this repo ran late or not at all.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Each request times out and each source has a budget; this is the backstop, so a hang can't hold up the next runs
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
      # Reads menus published as documents (PDFs, a Sway, a Canva) when they change; without it they wait in Source health
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_DAILY_USD: ${{ vars.LLM_DAILY_USD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: ingest
        run: npm run ingest -- --report "$RUNNER_TEMP"
      # Contributors' submissions (their own scripts, posted with a token) are trusted: publish what's waiting
      - id: trusted
        if: ${{ !cancelled() }}
        run: npm run submissions -- approve --trusted
      # Even if one source failed, the others were saved: rebuild if anything was. And rebuild on the day's first run
      # (pg_cron starts it at 06:07 UTC) whatever changed, so prerendered pages and descriptions are today's, not
      # yesterday's, on a day no menu changes. Skipped until the hook exists.
      - if: ${{ !cancelled() }}
        env:
          CHANGED: ${{ steps.ingest.outputs.changed == 'true' || steps.trusted.outputs.published == 'true' }}
        run: |
          if [ "$CHANGED" = true ] || [ "$(date -u +%H%M)" -lt 0630 ]; then
            [ -z "$CF_DEPLOY_HOOK" ] || curl -fsS -X POST "$CF_DEPLOY_HOOK" > /dev/null
          fi
      # One open issue, its body the failing sources, made the first time; edited only when that changes (the time
      # aside), with a comment when a source starts failing or recovers, since an edited body notifies no one
      - if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/health.md" ] || exit 0
          number=$(gh issue list --state open --search 'in:title "Source health"' --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            url=$(gh issue create --title 'Source health' --body-file "$RUNNER_TEMP/health.md")
            number=${url##*/}
          fi
          before=$(gh issue view "$number" --json body --jq .body | grep -v '^Checked ' || true)
          after=$(grep -v '^Checked ' "$RUNNER_TEMP/health.md" || true)
          if [ "$before" != "$after" ]; then gh issue edit "$number" --body-file "$RUNNER_TEMP/health.md"; fi
          if [ -f "$RUNNER_TEMP/health-comment.md" ]; then gh issue comment "$number" --body-file "$RUNNER_TEMP/health-comment.md"; fi
