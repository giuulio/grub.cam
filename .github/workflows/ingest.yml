name: Ingest menus

# Fetches every scripted source from this week's Monday until a week comes back empty and saves it to Supabase.
# Needs repository secrets VITE_SUPABASE_URL and SUPABASE_SECRET_KEY; with CF_DEPLOY_HOOK (a Workers Builds deploy hook) set it then rebuilds
# the site, so the prerendered pages, sitemap and llms.txt carry the new menus.
# Started every two hours from 04:37 to 18:37 UTC by Supabase's pg_cron (migration 0031), not GitHub's cron, which on
# this repo ran late or not at all.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingest
      # Contributors' submissions (their own scripts, posted with a token) are trusted: publish what's waiting
      - if: ${{ !cancelled() }}
        run: npm run submissions -- approve --trusted
      # Even if one source failed, the others were saved: rebuild anyway. Skipped until the hook exists.
      - if: ${{ !cancelled() }}
        run: '[ -z "$CF_DEPLOY_HOOK" ] || curl -fsS -X POST "$CF_DEPLOY_HOOK" > /dev/null'
