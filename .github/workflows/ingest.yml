name: Ingest menus

# Fetches every scripted source from this week's Monday until a week comes back empty and saves it to Supabase.
# Needs repository secrets VITE_SUPABASE_URL and SUPABASE_SECRET_KEY; with CF_PAGES_DEPLOY_HOOK set it then rebuilds
# the site, so the prerendered pages, sitemap and llms.txt carry the new menus.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17 * * *' # 05:15, 11:15 and 17:15 UTC: menus change, so check often

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingest
      # Contributors' submissions (their own scripts, posted with a token) are trusted: publish what's waiting
      - if: ${{ !cancelled() }}
        run: npm run submissions -- approve --trusted
      # Even if one source failed, the others were saved: rebuild anyway. Skipped until the hook exists.
      - if: ${{ !cancelled() }}
        run: '[ -z "$CF_PAGES_DEPLOY_HOOK" ] || curl -fsS -X POST "$CF_PAGES_DEPLOY_HOOK" > /dev/null'
