name: Ingest menus

# Fetches every scripted source from today until a week comes back empty and saves it to Supabase.
# Needs repository secrets VITE_SUPABASE_URL and SUPABASE_SECRET_KEY.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17 * * *' # 05:15, 11:15 and 17:15 UTC: menus change, so check often

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingest
