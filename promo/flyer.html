<!doctype html>
<!--
  One single-sided A4 sheet with four A6 flyers, black on white, saying what grub.cam is.
  Edit the flyer once, in its <template>; the script lays it out four times.
  The unused "send" template is kept as an alternative; change data-flyer to "send" to use it instead.
  Render to PDF (fonts load from node_modules, hence the file-access flag):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --no-pdf-header-footer \
      --allow-file-access-from-files --virtual-time-budget=5000 --print-to-pdf=promo/flyer.pdf promo/flyer.html
  Print at 100% / actual size, not "fit to page", so the cut lines fall on 105 × 148.5 mm.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>grub.cam flyers</title>
<style>
  @font-face {
    font-family: Figtree;
    font-weight: 300 900;
    src: url('../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Public Sans';
    font-weight: 100 900;
    src: url('../node_modules/@fontsource-variable/public-sans/files/public-sans-latin-wght-normal.woff2') format('woff2');
  }

  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; background: #fff; color: #000; }
  body { font-family: 'Public Sans', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    position: relative;
    width: 210mm;
    height: 297mm;
    display: grid;
    grid-template-columns: 105mm 105mm;
    grid-template-rows: 148.5mm 148.5mm;
    break-inside: avoid;
    overflow: hidden;
  }
  /* Cut lines through the middle: a clean cut takes them away */
  .sheet::before, .sheet::after { content: ''; position: absolute; border: 0 dashed #9a9a9a; }
  .sheet::before { left: 105mm; top: 0; bottom: 0; border-left-width: 0.2mm; }
  .sheet::after { top: 148.5mm; left: 0; right: 0; border-top-width: 0.2mm; }

  /* 10 mm in from every edge: clear of the printer's margin and a wobbly cut */
  .flyer { padding: 10mm 10mm 9mm; display: flex; flex-direction: column; }
  .flyer > * { flex-shrink: 0; }

  h1 { font-family: Figtree; font-weight: 800; line-height: 0.98; letter-spacing: -0.025em; }
  .lede { margin-top: 4mm; font-size: 11pt; line-height: 1.35; text-wrap: pretty; }

  .scan { margin-top: auto; display: flex; flex-direction: column; align-items: center; text-align: center; }
  /* 42 mm code, with four clear modules on every side for scanning. */
  .qr { width: 55.44mm; height: 55.44mm; flex: none; }
  .url { font-family: Figtree; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .under { margin-top: 1.5mm; font-size: 8.5pt; line-height: 1.3; }

  .foot { margin-top: 4mm; padding-top: 2.4mm; border-top: 0.2mm solid #000; font-size: 8pt; line-height: 1.3; }
  .foot b { font-weight: 700; }
  .small { margin-top: 1mm; font-size: 5.5pt; line-height: 1.3; }

  .what h1 { font-size: 58pt; }
  .what .lede { font-size: 11.5pt; }
  .what .url { font-size: 32pt; }
  .send h1 { font-size: 33pt; }
  .send .url { font-size: 24pt; }
</style>
</head>
<body>
<div class="sheet" data-flyer="what"></div>

    <p class="small">Independent; not affiliated with the University of Cambridge or its colleges.</p>

<script>
